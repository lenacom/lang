<html>
  <head>
    <title>Управление французских глаголов, предлоги à и de</title>
    <meta charset="UTF-8">
    <script src="js/common.js"></script>
    <script src="js/small_steps.js"></script>
    <script src="js/fr_a_de.js"></script>
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body>
    <div id="test"></div>
    <div id="progress"></div>
    <hr/>
    <div id="item"></div>
    <div><button style="margin-top:10px" onClick="checkAnswer()">Дальше</button></div>
    <div id="error"></div>
    <script>
      const LANG = "fr-FR";
      initSpeak(LANG);
      document.write(autospeakHTML());
      const { getState, setAnswered } = SmallSteps("fr_a_de", items);

      let correctItemWords;
      let itemWords;

      function variants(text) {
        const regex = /( à | de | | d’)(faire qch|qch|qn|avoir fait qch)/ig; 
        correctItemWords = text.replace(regex, "--$1--$2").split("--");
        itemWords = text.replace(regex, "-- --$2").split("--");
        return correctItemWords.map((word, index)  => {
          if ([" à ", " de ", " ", " d’"].includes(word)) {
            return `&nbsp;<select name="part${index}" onChange="itemWords[${index}] = this.value">
              <option value=" " selected> </option>
              <option value=" à ">à</option>
              <option value="${ word === " d’" ? word : " de "}">de</option>
            </select>&nbsp;`;
          } else {
            return word;
          }
        }).join("");
      }

      function setItem() {
        const { limit, part, item } = getState();
        byId("test").innerHTML = `Тесты по ${limit} из ${items.length}.`;
        byId("progress").innerHTML = `Осталось тестов: ${part.length + 1}.`;
        byId("item").innerHTML = `<div>${item[1]}</div>
          <div style="display: flex; align-items: flex-start; flex-wrap: wrap;">${variants(item[0])}</div>`;
      }

      function checkAnswer() {
        let ok = true;
        for (let i = 0; i < itemWords.length; i++) {
          if (itemWords[i] !== correctItemWords[i]) {
            ok = false;
            break;
          }
        }
        if (ok) {
          byId("error").innerHTML = "";
        } else {
          const { item } = getState();
          const speakText = item[0].replace("qn", "quelqu’un").replace("qch", "quelquechose");
          if (globalThis.autospeak) {
            speak(speakText, LANG);
          }
          byId("error").innerHTML = `<div>${item[1]}</div>
          <div class="error"><span>${item[0]}</span> ${speakButtonHTML(speakText, LANG)}</div>`;
        }
        setAnswered(ok);
        setItem();
      }
      
      setItem();
    </script>
  </body>
</html>
