      const LANG = "fr-FR";
      initSpeak(LANG);
      menu();
      const { getState, setAnswered } = SmallSteps("fr_noun_gen", nouns);

      function setItem() {
        const { limit, part, item } = getState();
        byId("test").innerHTML = `Тесты по ${limit} из ${nouns.length}.`;
        byId("progress").innerHTML = `Осталось тестов: ${part.length + 1}.`;
        byId("item").innerHTML = itemHTML(item);
      }

      function itemHTML(item) {
        return `<div><span style="display: flex; flex-direction: row; gap: 20px; flex-wrap: wrap;">
		      <span>${item[0]} ${item[1]? `[${item[1]}]` : ""}</span>
          ${speakButtonHTML(item[0], LANG)} ${item[3]}</div>`;
      }

      function errorHTML(item) {
        const trans = item[1]? `[${item[1]}]` : "";
        return `<div style="display: flex; flex-direction: row; gap: 20px; flex-wrap: wrap;">
          <span class="${item[2]}">${item[0]} ${item[2]}</span> ${item[1]? `[${item[1]}]` : ""} 
          ${speakButtonHTML(item[0], LANG)} ${item[3]}</div>`;
      }

      function checkAnswer(answer) {
        const { item } = getState();
        const ok = item[2] === answer;
        if (!ok) {
          byId("error").innerHTML = errorHTML(item) + byId("error").innerHTML;
        }
        setAnswered(ok);
        setItem();
      }

      setItem();
