  <body>
    <div id=index style="display:block" ></div>
    <div id="phrase1"></div>
    <div id="phrase2"></div>
    <input id="next" style="display:none" type="button" value="Дальше" onclick="next()"/>
    <script>
      const index = document.getElementById("index");
      const phrase1 = document.getElementById("phrase1");
      const phrase2 = document.getElementById("phrase2");
      const button = document.getElementById("next");
      
      let indexHtml = "";
      for (let key of Object.keys(phrases)) {
        indexHtml += `<a href="javascript:setPart('${key}')">${key}</a> `;
      }
      index.innerHTML = indexHtml;

      let partIndex;
      let phraseIndex;
      let part;

      function show(element) {
        element.style.display = "block"; 
      }

      function hide(element) {
        element.style.display = "none"; 
      }

      function setPart(_index) {
        partIndex = _index;
        part = phrases[partIndex].slice();
        hide(index);
        show(button);
        setPhrase();
      }

      function setPhrase() {
        phrase1.innerText = "";
        phrase2.innerText = "";
        if (part.length === 0) {
          show(index);
          hide(button);
        } else {
          phraseIndex = Math.round(Math.random() * (part.length - 1)); 
          phrase1.innerText = part[phraseIndex][1];
        } 
      }

      function next() {
        if (phrase2.innerText === "") {
          phrase2.innerText = part[phraseIndex][0];
          part.splice(phraseIndex, 1); 
        } else {
          setPhrase();
        }
      }
    </script>
