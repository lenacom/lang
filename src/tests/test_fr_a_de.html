  <body>
    <div id="test"></div>
    <div id="successPercent"></div>
    <div id="errors"></div>
    <script>
      const LANG = "fr";

      const elmTest = document.getElementById("test");
      const elmSuccessfulAnswersPercent = document.getElementById("successPercent");
      const elmErrors = document.getElementById("errors");
      
      let test;
      let correctTestParts;
      let testParts;
      let countTests = 0;
      let countSuccessfulAnswersTests = 0;

      function addVariants(text) {
        const regex = /( à | de | )(faire qch|qch|qn)/ig; 
        correctTestParts = text.replace(regex, "--$1--$2").split("--");
        testParts = text.replace(regex, "-- --$2").split("--");
        return correctTestParts.map((part, index)  => {
          if ([" à ", " de ", " "].includes(part)) {
            return `&nbsp;<select name="part${index}" onChange="testParts[${index}] = this.value">
              <option value=" " selected> </option>
              <option value=" à ">à</option>
              <option value=" de ">de</option>
            </select>&nbsp;`;
          } else {
            return part;
          }
        }).join("");
      }

      function setTest() {
        if (tests.length === 0) {
          elmTest.innerHTML = "";
          return;
        }

        const index = Math.round(Math.random() * (tests.length - 1));
        test = tests[index];
        tests.splice(index, 1);
        const testHTML = `
          <div>${test[1]}</div>
          <div style="display: flex; align-items: flex-start; flex-wrap: wrap;">${addVariants(test[0])}</div>
          <div><button onClick="checkAnswer()"">Дальше</button></div>
        `;
        elmTest.innerHTML = testHTML;
      }

      function checkAnswer() {
        countTests += 1;
        let error = false;
        for (let i = 0; i < testParts.length; i++) {
          if (testParts[i] !== correctTestParts[i]) {
            error = true;
          }
        }
        if (error) {
          elmErrors.innerHTML = `<div>${test[1]}</div><div class="error">${test[0]}</div>` + elmErrors.innerHTML;
        } else {
          countSuccessfulAnswersTests += 1;
        }
        elmSuccessfulAnswersPercent.innerHTML = Math.round((countSuccessfulAnswersTests / countTests) * 100) + "%";
        setTest();
      }

      function wordWithSpeakBtnHTML(text) {
        return `
          <div><span style="display: flex; flex-direction: row; gap: 10px;">
            <span>${text}</span>
            ${speakBtnHTML(text)}
          </div>`;
      }

      function speakBtnHTML(text, lang, style) {
        if (!window.speechSynthesis) {
          return "";
        }
        return `
          <button style="margin-top: auto;" onClick="speak('${text.replace("'", "\\'")}', '${LANG}')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="20" height="20">
              <path fill="currentColor" d="M48 352l48 0 134.1 119.2c6.4 5.7 14.6 8.8 23.1 8.8 19.2 0 34.8-15.6 34.8-34.8l0-378.4c0-19.2-15.6-34.8-34.8-34.8-8.5 0-16.7 3.1-23.1 8.8L96 160 48 160c-26.5 0-48 21.5-48 48l0 96c0 26.5 21.5 48 48 48zM441.1 107c-10.3-8.4-25.4-6.8-33.8 3.5s-6.8 25.4 3.5 33.8C443.3 170.7 464 210.9 464 256s-20.7 85.3-53.2 111.8c-10.3 8.4-11.8 23.5-3.5 33.8s23.5 11.8 33.8 3.5c43.2-35.2 70.9-88.9 70.9-149s-27.7-113.8-70.9-149zm-60.5 74.5c-10.3-8.4-25.4-6.8-33.8 3.5s-6.8 25.4 3.5 33.8C361.1 227.6 368 241 368 256s-6.9 28.4-17.7 37.3c-10.3 8.4-11.8 23.5-3.5 33.8s23.5 11.8 33.8 3.5C402.1 312.9 416 286.1 416 256s-13.9-56.9-35.5-74.5z"/>
            </svg>
          </button>`;
      }

      function speak(text, lang) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang; 
        const voices = window.speechSynthesis.getVoices();
        const voice = voices.find(voice => voice.lang === lang);
        if (voice) {
          utterance.voice = voice;
        }
        window.speechSynthesis.speak(utterance);
      }

      setTest();
    </script>
