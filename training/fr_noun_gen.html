<html>
  <head>
    <title>Род французских существительных</title>
    <meta charset="UTF-8">
    <script src="js/common.js"></script>
    <script src="js/small_steps.js"></script>
    <script src="js/fr_nouns.js"></script>
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body>
    <div id="fr_noun_gen"></div>
    <script>
      const LANG = "fr-FR";
      initSpeak(LANG);
      const smallSteps = SmallSteps("fr_noun_gen", items, itemHTML, checkAnswer, errorHTML);

      let correctItemWords;
      let itemWords;

      function variants(text) {
        const regex = /( à | de | | d’)(faire qch|qch|qn|avoir fait qch)/ig; 
        correctItemWords = text.replace(regex, "--$1--$2").split("--");
        itemWords = text.replace(regex, "-- --$2").split("--");
        return correctItemWords.map((word, index)  => {
          if ([" à ", " de ", " ", " d’"].includes(word)) {
            return `&nbsp;<select name="part${index}" onChange="itemWords[${index}] = this.value">
              <option value=" " selected> </option>
              <option value=" à ">à</option>
              <option value="${ word === " d’" ? word : " de "}">de</option>
            </select>&nbsp;`;
          } else {
            return word;
          }
        }).join("");
      }

      function itemHTML(item) {
        return `<div style="display: flex; flex-direction: row; gap: 20px;">
            <span>${item[0]} ${item[1]}</span>
            ${speakButtonHTML(fullText(text), LANLG)}
          </div>
          <div>${3}</div>
          <div>
            <button>муж.</button>
            <button>жен.</button>
            <button>муж. и жен.</button>
          </div>`;
      }

      function checkAnswer(item) {
        for (let i = 0; i < itemWords.length; i++) {
          if (itemWords[i] !== correctItemWords[i]) {
            return false;
          }
        }
        return true;
      }

      function errorHTML(item) {
        if (globalThis.autospeak) {
          speak(fullText(item[0]), LANG);
        }
        return `<div>${item[1]}</div><div class="error">${withSpeakButtonHTML(item[0])}</div>`;
      }

      document.write(autospeakHTML());
    </script>
  </body>
</html>
