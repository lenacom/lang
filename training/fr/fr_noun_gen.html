      const LANG = "fr-FR";
      initSpeak(LANG);
      const { getState, setAnswered } = SmallSteps("fr_noun_gen", nouns);

      function markEnding(word) {
        const regexps = [
          [
            /^(.{2,}?)(aine|ance|ence|té|ade|aison|ance|esse|ine|ison|itude|ose|sion|tion|aille|eille|elle|enne|ère|ette|euse|ie|ille|ise|ière|onne|trice)$/,
            "$1<span class='f'>$2</span>"
          ],
          [
            /^(.{1,}?[^àâaéèêëeîïiôoùûü])(ure)$/,
            "$1<span class='f'>$2</span>"
          ],
          [ 
            /^(.{2,}?)(age|ard|aire|eau|ème|isme|ot|ail|al|an|eil|el|en|ien|er|ier|et|il|ait|ain|ier|oir|ing|ent|oin|ain|eu|at|ut|au|ou|o|ir)$/,
            "$1<span class='m'>$2</span>"
          ],
          [ 
            /^(.{1,}?[^i])(on)$/,
            "$1<span class='m'>$2</span>"
          ],
          [
            /^(.{1,}?[^àâaéèêëeîïiôoùûü])(i|u|é|in|is|it)$/,
            "$1<span class='m'>$2</span>"
          ],
          [
            /^(.{2,}?)(gramme|ment|teur)$/,
            "$1<span class='m'>$2</span>"
          ]
        ];

        for (let regexp of regexps) {
          const updated = word.replace(regexp[0], regexp[1]);
          if (updated !== word) {
            return updated;
          }
        }
        return word;
      }   

      function setItem() {
        const { limit, part, item } = getState();
        byId("test").innerHTML = `Слова по ${limit} из ${nouns.length}.`;
        byId("progress").innerHTML = `Осталось слов: ${part.length + 1}.`;
        byId("item").innerHTML = itemHTML(item);
      }

      function itemHTML(item) {
        return `<div><span style="display: flex; flex-direction: row; gap: 20px; flex-wrap: wrap;">
		      <span>${markEnding(item[0])} ${item[1]? `[${item[1]}]` : ""}</span>
          ${speakButtonHTML(item[0], LANG)}</div><div>${item[3]}</div>`;
      }

      function errorHTML(item) {
        const trans = item[1]? `[${item[1]}]` : "";
        return `<div style="display: flex; flex-direction: row; gap: 20px; flex-wrap: wrap;">
          <span class="${item[2]}">${item[0]} ${item[2]}</span> ${item[1]? `[${item[1]}]` : ""} 
          ${speakButtonHTML(item[0], LANG)} ${item[3]}</div>`;
      }

      async function checkAnswer(button, answer) {
        button.disabled = true;
        const { item } = getState();
        const ok = item[2] === answer;
        if (!ok) {
          byId("error").innerHTML = errorHTML(item) + byId("error").innerHTML;
        }
        setAnswered(ok);
        setItem();
        await sleep(500);
        button.disabled = false;
      }

      setItem();
    </script>
