      const LANG = "fr-FR";
      initSpeak(LANG);
      menu();
      document.write(autospeakHTML());
      const { getState, setAnswered } = SmallSteps("fr_noun_gen", nouns);

      function setItem() {
        const { limit, part, item } = getState();
        byId("test").innerHTML = `Тесты по ${limit} из ${nouns.length}.`;
        byId("progress").innerHTML = `Осталось тестов: ${part.length + 1}.`;
        byId("item").innerHTML = itemHTML(item);
        if (globalThis.autospeak) {
          speak(item[0], LANG);
        }
      }

      function itemHTML(item) {
        const trans = item[1]? `[${item[1]}]` : "";
        return `<div><span style="display: flex; flex-direction: row; gap: 20px;">
		      <span>${item[0]} ${trans}</span>${speakButtonHTML(item[0], LANG)}</div><div>${item[3]}</div>`;
      }

      function checkAnswer(answer) {
        const { item } = getState();
        const ok = item[2] === answer;
        byId("error").innerHTML = ok? "" : itemHTML(item) + `<div class="error">${item[2]}</div>`;
        setAnswered(ok);
        setItem();
      }

      setItem();
    </script>
